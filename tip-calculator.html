<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <title>Tip Calculator / Trinkgeld Rechner</title> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet"> <style> body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; } .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); text-align: center; width: 95%; max-width: 400px; } h2 { font-family: 'Roboto', sans-serif; font-size: 38px; margin-bottom: 20px; color: #2e7dff; } label { font-size: 20px; font-weight: bold; display: block; margin-bottom: 8px; } input { width: 90%; font-size: 22px; padding: 12px; margin-bottom: 25px; border-radius: 12px; border: 1px solid #ccc; text-align: center; } button { padding: 18px; font-size: 20px; border: none; border-radius: 12px; background: #2e7dff; color: white; cursor: pointer; margin: 5px 2px; width: 48%; } button:hover { background: #1f5fcc; } button.other-btn { width: 98%; } #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: white; z-index: 10; text-align: center; padding-top: 40px; } #overlay h2 { font-family: 'Roboto', sans-serif; font-size: 40px; margin-bottom: 20px; color: #2e7dff; } #overlay p { font-size: 24px; margin: 10px 0; } #customTipContainer { margin: 20px 0; display: none; } #customTipInput { font-size: 22px; padding: 10px; width: 40%; text-align: center; border-radius: 10px; border: 1px solid #ccc; margin-right: 10px; } #applyCustomTip { font-size: 20px; padding: 10px 20px; border: none; border-radius: 10px; background: #2e7dff; color: white; cursor: pointer; } #applyCustomTip:hover { background: #1f5fcc; } #totalAmount { font-size: 48px; font-weight: bold; color: #2e7dff; } #overlay button.closeBtn { font-size: 24px; padding: 15px 30px; width: 60%; margin-top: 30px; } </style> </head> <body> <div class="container"> <h2>Tip / Trinkgeld</h2> <label for="bill">Total/Gesamtbetrag</label> <input id="bill" type="number"> <div> <button onclick="calcTip(0.05)">5%</button> <button onclick="calcTip(0.08)">8%</button> <button onclick="calcTip(0.10)">10%</button> <button onclick="calcTip(0.15)">15%</button> <button class="other-btn" onclick="showCustomTipInput()">Other / Anderer Betrag</button> </div> </div> <div id="overlay"> <h2>Trinkgeld / Tip</h2> <p id="subTotal"></p> <p id="tipAmount"></p> <p id="totalAmount"></p> <div id="customTipContainer"> <input id="customTipInput" type="number" placeholder="Trinkgeld / Tip"> <button id="applyCustomTip">Apply</button> </div> <button class="closeBtn" onclick="closeOverlay()">Clear</button> </div> <script> function formatEuro(amount) { return amount.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' }); } function showOverlay(bill, tip, total) { document.getElementById("subTotal").innerText = "Zwischensumme / Sub-total: " + formatEuro(bill); document.getElementById("tipAmount").innerText = "Trinkgeld / Tip: " + formatEuro(tip); document.getElementById("totalAmount").innerText = "Gesamt / Total: " + formatEuro(total); document.getElementById("overlay").style.display = "block"; } function calcTip(percent) { let bill = parseFloat(document.getElementById("bill").value); if (!bill) { alert("Bitte Gesamtbetrag eingeben / Please enter total amount"); return; } let tip = bill * percent; let total = bill + tip; showOverlay(bill, tip, total); document.getElementById("bill").value = ""; document.getElementById("bill").blur(); document.getElementById("customTipContainer").style.display = "none"; } function showCustomTipInput() { let bill = parseFloat(document.getElementById("bill").value); if (!bill) { alert("Bitte Gesamtbetrag eingeben"); return; } showOverlay(bill, 0, bill); let container = document.getElementById("customTipContainer"); container.style.display = "block"; let input = document.getElementById("customTipInput"); input.value = ""; input.focus(); // Auto-open keyboard } document.getElementById("applyCustomTip").addEventListener("click", function() { let bill = parseFloat(document.getElementById("bill").value); let tip = parseFloat(document.getElementById("customTipInput").value); if (isNaN(tip)) { alert("Ungültiger Betrag / Invalid amount"); return; } let total = bill + tip; document.getElementById("tipAmount").innerText = "Trinkgeld / Tip: " + formatEuro(tip); document.getElementById("totalAmount").innerText = "Gesamt / Total: " + formatEuro(total); document.getElementById("customTipContainer").style.display = "none"; }); function closeOverlay() { document.getElementById("overlay").style.display = "none"; document.getElementById("customTipContainer").style.display = "none"; } // Keyboard handling document.getElementById("bill").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); this.blur(); } }); document.getElementById("customTipInput").addEventListener("keydown", function(e){ if(e.key === "Enter"){ document.getElementById("applyCustomTip").click(); } }); </script> </body> </html>
